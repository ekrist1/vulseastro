name = "vulse-play"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# vulse:d1
[[d1_databases]]
binding = "DB"
database_name = "vulse-db"
database_id = "local-dev"
migrations_dir = "node_modules/vulse/migrations"

# vulse:r2
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "vulse-media"

[vars]
BETTER_AUTH_SECRET = "dev-secret-change-me-in-production-32chars"

# vulse:form-queue — async submission processing (notify/confirmation emails, webhooks)
# [[queues.producers]]
# queue = "vulse-form-queue"
# binding = "FORM_QUEUE"
#
# [[queues.consumers]]
# queue = "vulse-form-queue"
# max_batch_size = 10
# max_batch_timeout = 30
