name = "vulse-play"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# vulse:d1
[[d1_databases]]
binding = "DB"
database_name = "vulse-db"
database_id = "local-dev"
migrations_dir = "node_modules/@vulsecms/core/migrations"

# vulse:r2
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "vulse-media"

[vars]
BETTER_AUTH_SECRET = "dev-secret-change-me-in-production-32chars"
VULSE_ALLOW_MEMBER_SIGNUP = "true"
# EMAIL_FROM = "noreply@yourdomain.com"

# vulse:send-email — Cloudflare Email Routing (password reset + form notifications)
# Requires Email Routing configured for your domain in the Cloudflare dashboard.
# Local dev: wrangler simulates the binding — emails are logged, never actually sent.
# Docs: https://developers.cloudflare.com/email-routing/email-workers/send-email-workers/
#       https://developers.cloudflare.com/email-routing/email-workers/local-development/
#
# [[send_email]]
# name = "SEND_EMAIL"

# vulse:form-queue — async submission processing (notify/confirmation emails, webhooks)
# [[queues.producers]]
# queue = "vulse-form-queue"
# binding = "FORM_QUEUE"
#
# [[queues.consumers]]
# queue = "vulse-form-queue"
# max_batch_size = 10
# max_batch_timeout = 30
