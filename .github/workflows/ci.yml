name: ci
on:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      # Build first: some unit tests resolve the package by name (@vulsecms/core),
      # which needs dist/ to exist.
      - run: pnpm --filter @vulsecms/core build
      - run: pnpm --filter @vulsecms/core test
      - run: pnpm --filter @vulsecms/core test:integration
      # The playground consumes the package like a real project (workspace:*).
      # Building it here keeps it from drifting as the package evolves.
      - run: pnpm --filter vulse-play build
