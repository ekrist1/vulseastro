name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # Recommended for modern NPM publishing / provenance

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vulsecms/core exec node scripts/sync-version.mjs
      - run: pnpm --filter @vulsecms/core test
      - run: pnpm --filter @vulsecms/core test:integration
      - run: pnpm --filter @vulsecms/core build

      # Extra safety: Ensure .npmrc points to the registry token env variable
      - name: Configure NPM Auth
        run: echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > .npmrc

      - name: Publish to npm
        working-directory: packages/vulse
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # Ensure this secret holds the new token
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            # Derive the npm dist-tag from the prerelease label (e.g. 0.1.0-beta.0 -> beta)
            PRERELEASE="${VERSION#*-}"
            TAG="${PRERELEASE%%.*}"
            npm publish --access=public --tag "$TAG"
          else
            npm publish --access=public
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
